version: '3.8'

services:
  postgres:
    # Use the local Dockerfile or official postgres:15 image
    build: .
    image: learning-analytics:latest
    container_name: learning_analytics_postgres
    
    # Environment variables
    environment:
      POSTGRES_DB: ${DB_NAME:-learning_analytics}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-tool123}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    
    # Port mapping (host:container)
    ports:
      - "5433:5432"
    
    # Volumes for persistent data
    volumes:
      # Persist database data between container restarts
      - postgres_data:/var/lib/postgresql/data
      # Mount data and code directories for access
      - ./Data:/data:ro
      - ./Code:/scripts:ro
    
    # Health check
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d learning_analytics"]
      interval: 10s
      timeout: 5s
      retries: 5
    
    # Restart policy
    restart: unless-stopped
    
    # Logging
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# Named volume for persistent PostgreSQL data
volumes:
  postgres_data:
    driver: local

# Network (optional - useful if adding more services)
networks:
  default:
    name: learning_analytics_network
